<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
<div style="max-width:700px;margin:30px auto;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:30px;">
        <h2>Hi <span th:text="${name}">Customer</span>,</h2>
        <p th:text="${cancelled} ? 'Your order has been cancelled' : 'Your order has been successfully placed!'"></p>
        <p th:text="${cancelled} ? 'We are sorry to see your order cancelled.' : 'Thank you for your purchase!'"></p>
        <div style="background:#f9fafb;padding:15px;border-radius:6px;margin:20px 0;">
            <strong>Order Number:</strong> <span th:text="${orderNumber}"></span><br>
            <strong>Status:</strong>
            <span th:text="${status}" th:style="${cancelled} ? 'color:#b91c1c;font-weight:bold;' : 'color:#15803d;font-weight:bold;'"></span>
        </div>
        <h3>Order Items</h3>
        <table style="width:100%;border-collapse:collapse;margin-top:15px;">
            <thead>
            <tr style="background:#f3f4f6;">
                <th style="padding:12px;text-align:left;">Product</th>
                <th style="padding:12px;text-align:center;">Quantity</th>
                <th style="padding:12px;text-align:right;">Price</th>
                <th style="padding:12px;text-align:right;">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td style="padding:12px;border-bottom:1px solid #eeeeee;" th:text="${item.productName}"></td>
                <td style="padding:12px;border-bottom:1px solid #eeeeee;text-align:center;" th:text="${item.quantity}"></td>
                <td style="padding:12px;border-bottom:1px solid #eeeeee;text-align:right;"
                    th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}"></td>
                <td style="padding:12px;border-bottom:1px solid #eeeeee;text-align:right;"
                    th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            </tbody>
        </table>
        <div style="text-align:right;margin-top:20px;font-size:18px;">
            <strong th:text="'Total: ₹' + ${#numbers.formatDecimal(totalAmount, 1, 'COMMA', 2, 'POINT')}"></strong>
        </div>
        <p style="margin-top:30px;color:#666666;"
           th:text="${cancelled} ? 'If you did not request this cancellation, please contact support.' : 'We appreciate your business and hope you enjoy your purchase!'"></p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
