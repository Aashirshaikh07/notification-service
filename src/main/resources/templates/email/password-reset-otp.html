<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
<div style="max-width:700px;margin:30px auto;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:30px;">
        <h2>Hi <span th:text="${name}">Customer</span>,</h2>
        <p>We received a request to reset your password. Use the code below to continue.</p>
        <div style="background:#f9fafb;padding:20px;border-radius:6px;margin:20px 0;text-align:center;">
            <span style="font-size:32px;letter-spacing:8px;font-weight:bold;color:#111827;" th:text="${otp}">000000</span>
        </div>
        <p>This code expires in <strong th:text="${expiresInMinutes}">10</strong> minutes and can be used only once.</p>
        <p style="margin-top:30px;color:#666666;">If you did not request this, you can safely ignore this email. Never share this code with anyone.</p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
